[package]
name = "reia_backend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"] # Compile this crate to a dynamic C library.

[dependencies]
dashmap = "6.2.1"
flume = "0.12.0"
godot = "0.5.5"
turso = { version = "0.7.2", features = ["sync"] }
parking_lot = "0.12.5"
quinn = "0.11.11"
rcgen = "0.14.10" # For generating self-signed certs during local dev
rkyv = "0.8.18" # Zero-copy serialization for networking
rustls = { version = "0.23.44", features = [
	"ring",
] } # Required by Quinn for TLS
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
