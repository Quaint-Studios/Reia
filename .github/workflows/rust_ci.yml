name: Rust CI & Quality Gate

on:
  pull_request:
    branches:
      - master
    paths:
      - "rust/**"
      - ".github/workflows/rust_ci.yml"
  push:
    branches:
      - master
    paths:
      - "rust/**"
      - ".github/workflows/rust_ci.yml"
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Test & Lint (ubuntu-latest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./rust

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./rust -> target"

      - name: Check Formatting
        run: cargo fmt --check

      - name: Compile & Check (All Targets)
        run: cargo check --all-targets

      - name: Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --all-targets

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v0.22.2

      - name: Install cargo-audit
        run: which cargo-audit || cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Dependencies (Security Advisories)
        run: cargo audit
